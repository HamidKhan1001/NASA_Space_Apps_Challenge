# Render blueprint: https://render.com/docs/blueprint-spec
# The Atlas is a static site. Render runs the build script, which copies the data
# contract and the docs next to the pages, then serves _site on a CDN.
services:
  - type: web
    name: kp-open-farm-atlas
    runtime: static
    plan: free
    buildCommand: ./scripts/build-site.sh
    staticPublishPath: ./_site
    pullRequestPreviewsEnabled: true
    buildFilter:
      paths:
        - site/**
        - data/**
        - docs/**
        - scripts/build-site.sh
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /guide
        destination: /guide.html
      - type: rewrite
        source: /methods
        destination: /methods.html
