<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b3a2d">
  <meta name="description" content="KP Open Farm Atlas: what grows where in Khyber Pakhtunkhwa, which land is irrigated, and whether each union council's crops got enough water in the last ten days.">
  <title>KP Open Farm Atlas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><span class="brand-long" data-i18n="app_title">KP Open Farm Atlas</span><span class="brand-short" data-i18n="app_title_short">KP Farm Atlas</span></a>
    <span class="badge demo" id="demoBadge" hidden data-i18n="demo_badge">DEMO DATA</span>
    <span class="badge offline" id="offlineBadge" hidden data-i18n="offline_badge">OFFLINE COPY</span>
    <div class="top-controls">
      <label class="ctl"><span data-i18n="dekad">Last ten days</span>
        <select id="dekadSelect" aria-label="Dekad"></select></label>
      <label class="ctl"><span data-i18n="language">Language</span>
        <select id="langSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="ur">اردو</option>
          <option value="ps">پښتو</option>
        </select></label>
      <a class="link methods-link" href="methods.html" data-i18n="methods">Methods</a>
    </div>
  </header>

  <div class="stage">
    <div id="map" role="application" aria-label="Map of Khyber Pakhtunkhwa"></div>
    <div class="legend" id="legend" aria-live="polite"></div>
    <div class="loading" id="loading" data-i18n="loading">Loading…</div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
    <button class="map-toggle" id="mapToggle" type="button" data-i18n="show_map">Map</button>
  </div>

  <footer class="foot">
    <span id="footGenerated"></span>
    <span id="footSources"></span>
    <a href="https://github.com/HamidKhan1001/NASA_Space_Apps_Challenge" rel="noopener">GitHub</a>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
