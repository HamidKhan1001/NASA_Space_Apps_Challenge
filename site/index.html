<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://cdn.plot.ly; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com https://unpkg.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d91">
  <meta name="description" content="KP Open Farm Atlas: where crops grow in Khyber Pakhtunkhwa and whether each union council's crops got enough water in the last ten days, from NASA and ESA open data.">
  <title>KP Open Farm Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-satellite"/></svg></span>
      <span class="brand-text">
        <b data-i18n="app_title">KP Open Farm Atlas</b>
        <span data-i18n="app_tagline">NASA Space Apps Challenge 2026</span>
      </span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="./" aria-current="page" data-i18n="nav_atlas">Atlas</a>
      <a href="guide.html" data-i18n="guide">Guide</a>
      <a href="methods.html" data-i18n="methods">Methods</a>
    </nav>
    <div class="badges">
      <span class="badge demo" id="demoBadge" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><span data-i18n="demo_badge">DEMO DATA</span>
      </span>
      <span class="badge offline" id="offlineBadge" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span data-i18n="offline_badge">OFFLINE COPY</span>
      </span>
    </div>
    <div class="toolbar">
      <label class="field">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-calendar"/></svg>
        <select id="dekadSelect" aria-label="Ten-day period"></select>
        <button class="play" id="playBtn" type="button" aria-label="Play the six periods">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-play"/></svg>
        </button>
      </label>
      <label class="field">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-globe"/></svg>
        <select id="langSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="ur">اردو</option>
          <option value="ps">پښتو</option>
        </select>
      </label>
    </div>
  </header>

  <div class="stage">
    <div id="map" role="application" aria-label="Map of Khyber Pakhtunkhwa"></div>
    <div class="map-tools">
      <div class="seg" id="baseSwitch" role="group" aria-label="Base map"></div>
      <button class="seg-btn solo on" id="labelToggle" type="button">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-info"/></svg>
      </button>
    </div>
    <div class="hud" id="hud" aria-hidden="true"></div>
    <div class="legend" id="legend" aria-live="polite"></div>
    <div class="loading" id="loading"><span class="spinner"></span><span data-i18n="loading">Loading…</span></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
    <button class="map-toggle" id="mapToggle" type="button">
      <svg class="icon icon-sm" aria-hidden="true"><use href="#i-map"/></svg><span id="mapToggleLabel">Map</span>
    </button>
  </div>

  <footer class="foot">
    <span id="footGenerated"></span>
    <span class="sep">·</span>
    <span id="footSources"></span>
    <span class="sep">·</span>
    <a href="https://github.com/HamidKhan1001/NASA_Space_Apps_Challenge" rel="noopener">
      GitHub <svg class="icon icon-sm" aria-hidden="true"><use href="#i-external"/></svg>
    </a>
  </footer>

  <script src="js/icons.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/layers/catalog.js"></script>
  <script src="js/services/layer-service.js"></script>
  <script src="js/components/layer-control.js"></script>
  <script src="js/components/temporal.js"></script>
  <script src="vendor/anime.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/services/state.js"></script>
  <script src="js/services/i18n.js"></script>
  <script src="js/services/errors.js"></script>
  <script src="js/services/http.js"></script>
  <script src="js/services/schema.js"></script>
  <script src="js/services/data-service.js"></script>
  <script src="js/services/csv.js"></script>
  <script src="js/services/motion.js"></script>
  <script src="js/components/states.js"></script>
  <script src="js/components/legend.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
