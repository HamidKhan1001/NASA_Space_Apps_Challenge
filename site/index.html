<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d91">
  <meta name="description" content="KP Open Farm Atlas: where crops grow in Khyber Pakhtunkhwa and whether each union council's crops got enough water in the last ten days, from NASA and ESA open data.">
  <title>KP Open Farm Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-satellite"/></svg></span>
      <span class="brand-text">
        <b data-i18n="app_title">KP Open Farm Atlas</b>
        <span data-i18n="app_tagline">NASA Space Apps Challenge 2026</span>
      </span>
    </a>
    <div class="badges">
      <span class="badge demo" id="demoBadge" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><span data-i18n="demo_badge">DEMO DATA</span>
      </span>
      <span class="badge offline" id="offlineBadge" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span data-i18n="offline_badge">OFFLINE COPY</span>
      </span>
    </div>
    <div class="toolbar">
      <label class="field">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-calendar"/></svg>
        <select id="dekadSelect" aria-label="Ten-day period"></select>
      </label>
      <label class="field">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-globe"/></svg>
        <select id="langSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="ur">اردو</option>
          <option value="ps">پښتو</option>
        </select>
      </label>
      <a class="tool-link" href="guide.html">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-book"/></svg><span data-i18n="guide">Guide</span>
      </a>
      <a class="tool-link ghost" href="methods.html">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-beaker"/></svg><span data-i18n="methods">Methods</span>
      </a>
    </div>
  </header>

  <div class="stage">
    <div id="map" role="application" aria-label="Map of Khyber Pakhtunkhwa"></div>
    <div class="legend" id="legend" aria-live="polite"></div>
    <div class="loading" id="loading"><span class="spinner"></span><span data-i18n="loading">Loading…</span></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
    <button class="map-toggle" id="mapToggle" type="button">
      <svg class="icon icon-sm" aria-hidden="true"><use href="#i-map"/></svg><span id="mapToggleLabel">Map</span>
    </button>
  </div>

  <footer class="foot">
    <span id="footGenerated"></span>
    <span class="sep">·</span>
    <span id="footSources"></span>
    <span class="sep">·</span>
    <a href="https://github.com/HamidKhan1001/NASA_Space_Apps_Challenge" rel="noopener">
      GitHub <svg class="icon icon-sm" aria-hidden="true"><use href="#i-external"/></svg>
    </a>
  </footer>

  <script src="js/icons.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
