name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 3"

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@v3

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pip-audit && pip-audit -r pipeline/requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan history for credentials
        run: |
          if git grep -nIE -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -e 'ghp_[A-Za-z0-9]{36}' -e 'AKIA[0-9A-Z]{16}' $(git rev-list --all | head -200) -- . ':!tests' ':!scripts/pr-check.mjs' | head -5 | grep .; then
            echo "::error::credential-like string found in history"; exit 1
          fi
