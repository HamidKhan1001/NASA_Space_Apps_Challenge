name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "docs/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline snapshot
        run: python3 pipeline/make_snapshot.py

      - name: Stage site with data and docs
        run: |
          rm -rf _site && mkdir _site
          cp -r site/. _site/
          rm -rf _site/data _site/docs
          cp -r data _site/data
          cp -r docs _site/docs
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
